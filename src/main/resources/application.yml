server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/luxixi}
    username: ${SPRING_DATASOURCE_USERNAME:luxixi}
    password: ${SPRING_DATASOURCE_PASSWORD:luxixi}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  flyway.enabled: true
management.endpoints.web.exposure.include: health,info
app.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5175,http://127.0.0.1:5175}
app.geo.enabled: ${GEO_ENABLED:true}
