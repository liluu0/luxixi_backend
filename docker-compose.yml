services:
  postgres:
    image: postgres:16-alpine
    container_name: luxixi-postgres
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    environment:
      POSTGRES_DB: luxixi
      POSTGRES_USER: luxixi
      POSTGRES_PASSWORD: luxixi
    ports: ["5432:5432"]
    volumes: ["luxixi_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxixi -d luxixi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  luxixi_pgdata:
